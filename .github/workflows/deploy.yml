name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -o IdentitiesOnly=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
            cd ~/cosmos-chat
            git fetch -q origin main
            git reset --hard -q origin/main
            docker compose config -q
            docker compose up -d --remove-orphans
            # compose only recreates on image/compose changes; bind-mounted
            # config edits need a manual refresh (git replaces file inodes).
            # Light stateless services are recreated, Caddy reloads gracefully.
            docker compose up -d --force-recreate --no-deps element join onboarding
            # regenerate the patched app shell from the running image so an
            # Element upgrade can never drift from the served index.html
            docker compose exec -T element cat /app/index.html \
              | ./scripts/patch-element-index.sh > caddy/assets/element-index.html
            grep -q register-redirect.js caddy/assets/element-index.html
            if [ -n "$(docker compose ps -q caddy)" ]; then
              docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
            fi
          '

      - name: Health check
        run: |
          ssh -o IdentitiesOnly=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
            cd ~/cosmos-chat
            docker compose ps --format "table {{.Name}}\t{{.Status}}"
            curl -fsS http://127.0.0.1:8008/health >/dev/null && echo "synapse: OK"
          '
