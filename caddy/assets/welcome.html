<!-- Custom Element welcome screen (embedded_pages.welcome_url).
     Injected into the app's DOM: styles apply, scripts never run.
     Create account goes to the captcha-gated /join page, never #/register. -->
<style>
  .cosmos_welcome {
    font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 400px; margin: 0 auto; padding: 40px 36px; text-align: center;
    background: rgba(22, 25, 31, .93); border: 1px solid #2b313b;
    border-radius: 12px; color: #e8eaed;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
  }
  .cosmos_welcome img { width: 72px; height: 72px; margin-bottom: 18px; }
  .cosmos_welcome h1 { font-size: 24px; margin: 0 0 8px; }
  .cosmos_welcome p { color: #9aa3af; font-size: 15px; margin: 0 0 28px; }
  .cosmos_btn {
    display: block; padding: 13px; margin-top: 12px; border-radius: 8px;
    font-size: 15px; font-weight: 600; text-decoration: none;
    color: #e8eaed; background: #2b313b;
  }
  .cosmos_btn:hover { background: #394049; }
  .cosmos_btn.primary { background: #0dbd8b; color: #fff; }
  .cosmos_btn.primary:hover { background: #0aa87c; }
</style>
<div class="cosmos_welcome">
  <img src="/branding/icon.png" alt="Cosmos">
  <h1>Welcome to Cosmos Chat</h1>
  <p>The Cosmos community, bridged with Discord</p>
  <a href="/join" class="cosmos_btn primary">Create account</a>
  <a href="#/login" class="cosmos_btn">Sign in</a>
</div>
